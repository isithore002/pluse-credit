name: Deploy PulseCredit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  backend-db-smoke:
    if: vars.ENABLE_BACKEND_DB_SMOKE == 'true'
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate required CI secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_KEY"

      - name: Assert startup fails without Supabase env
        run: |
          cd backend
          set +e
          SUPABASE_URL= SUPABASE_SERVICE_KEY= python -m uvicorn main:app --host 127.0.0.1 --port 8012 > /tmp/start_missing_env.log 2>&1
          exit_code=$?
          set -e
          cat /tmp/start_missing_env.log
          test "$exit_code" -ne 0
          grep -q "Missing SUPABASE_URL or SUPABASE_SERVICE_KEY" /tmp/start_missing_env.log

      - name: Start backend with strict DB mode
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8011 > /tmp/backend_smoke.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8011/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat /tmp/backend_smoke.log
          exit 1

      - name: Run strict DB-mode smoke checks
        env:
          API_BASE: http://127.0.0.1:8011
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python backend/ci/smoke_db_mode.py

      - name: Stop backend and print logs
        if: always()
        run: |
          pkill -f "uvicorn main:app" || true
          cat /tmp/backend_smoke.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Next.js
        run: |
          cd frontend
          npm run build

  deploy-backend:
    needs: [backend-tests, backend-db-smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RENDER_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json"

  deploy-frontend:
    needs: frontend-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: |
          npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend
