<svg width="980" height="900" viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <title>PulseCredit Sequence Diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#444" stroke-width="1.3"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#888" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="980" height="900" fill="#fafafa" rx="12"/>
  <text x="490" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">PulseCredit — Sequence Diagram</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#666">Full flow: PDF Upload → Scoring → Gemini Explanation → Dashboard Render</text>

  <!-- LIFELINE HEADERS -->
  <!-- User -->
  <rect x="30" y="70" width="100" height="36" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="80" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">User</text>
  <!-- Next.js -->
  <rect x="190" y="70" width="110" height="36" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="245" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#042C53">Next.js UI</text>
  <!-- FastAPI -->
  <rect x="360" y="70" width="110" height="36" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="415" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">FastAPI</text>
  <text x="415" y="100" text-anchor="middle" font-size="10" fill="#534AB7">Backend</text>
  <!-- Feature Engine -->
  <rect x="530" y="70" width="110" height="36" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="585" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">Feature</text>
  <text x="585" y="100" text-anchor="middle" font-size="10" fill="#534AB7">Engine</text>
  <!-- ML Ensemble -->
  <rect x="700" y="70" width="110" height="36" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="755" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#412402">ML</text>
  <text x="755" y="100" text-anchor="middle" font-size="10" fill="#412402">Ensemble</text>
  <!-- Gemini -->
  <rect x="868" y="70" width="90" height="36" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/>
  <text x="913" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A1B0C">Gemini</text>

  <!-- LIFELINES -->
  <line x1="80"  y1="106" x2="80"  y2="870" stroke="#1D9E75" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="245" y1="106" x2="245" y2="870" stroke="#378ADD" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="415" y1="106" x2="415" y2="870" stroke="#7F77DD" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="585" y1="106" x2="585" y2="870" stroke="#7F77DD" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="755" y1="106" x2="755" y2="870" stroke="#BA7517" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="913" y1="106" x2="913" y2="870" stroke="#D85A30" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="72"  y="160" width="16" height="40"  fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <rect x="237" y="165" width="16" height="600" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <rect x="407" y="220" width="16" height="440" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <rect x="577" y="280" width="16" height="180" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <rect x="747" y="470" width="16" height="120" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <rect x="905" y="620" width="16" height="120" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>

  <!-- SEQ 1: User → Next.js: upload PDF -->
  <line x1="80" y1="170" x2="237" y2="170" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="155" y="165" text-anchor="middle" font-size="11" fill="#085041">uploadFile(pdf)</text>

  <!-- SEQ 2: Next.js → FastAPI: POST /api/parse -->
  <line x1="245" y1="220" x2="407" y2="220" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="215" text-anchor="middle" font-size="11" fill="#042C53">POST /api/parse</text>

  <!-- SEQ 3: FastAPI parses PDF -->
  <rect x="407" y="240" width="170" height="26" rx="4" fill="#F3F0FF" stroke="#7F77DD" stroke-width="1"/>
  <text x="492" y="257" text-anchor="middle" font-size="10" fill="#534AB7">pdfplumber.extract_text()</text>

  <rect x="407" y="272" width="170" height="26" rx="4" fill="#F3F0FF" stroke="#7F77DD" stroke-width="1"/>
  <text x="492" y="289" text-anchor="middle" font-size="10" fill="#534AB7">detect_bank_format()</text>

  <rect x="407" y="304" width="170" height="26" rx="4" fill="#F3F0FF" stroke="#7F77DD" stroke-width="1"/>
  <text x="492" y="321" text-anchor="middle" font-size="10" fill="#534AB7">normalize_transactions()</text>

  <!-- SEQ 4: FastAPI → Feature Engine -->
  <line x1="423" y1="340" x2="577" y2="340" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="500" y="335" text-anchor="middle" font-size="11" fill="#26215C">compute_features(txns)</text>

  <!-- SEQ 5: Feature Engine computes 6 dims -->
  <rect x="577" y="356" width="190" height="26" rx="4" fill="#EAF3DE" stroke="#7F77DD" stroke-width="1"/>
  <text x="672" y="373" text-anchor="middle" font-size="10" fill="#085041">rhythm + merchant + social</text>

  <rect x="577" y="388" width="190" height="26" rx="4" fill="#EAF3DE" stroke="#7F77DD" stroke-width="1"/>
  <text x="672" y="405" text-anchor="middle" font-size="10" fill="#085041">calendar + velocity + NLP</text>

  <!-- Feature Engine → FastAPI: return feature vector -->
  <line x1="577" y1="424" x2="423" y2="424" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="500" y="419" text-anchor="middle" font-size="10" fill="#888">feature_vector[24]</text>

  <!-- FastAPI return parse result → Next.js -->
  <line x1="407" y1="450" x2="245" y2="450" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="325" y="445" text-anchor="middle" font-size="10" fill="#888">{profile_id, txn_count}</text>

  <!-- SEQ 6: POST /api/score -->
  <line x1="245" y1="470" x2="407" y2="470" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="465" text-anchor="middle" font-size="11" fill="#042C53">POST /api/score(profile_id)</text>

  <!-- FastAPI → ML Ensemble -->
  <line x1="423" y1="490" x2="747" y2="490" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="585" y="485" text-anchor="middle" font-size="11" fill="#26215C">run_ensemble(feature_vector)</text>

  <!-- ML: XGBoost + AE parallel -->
  <rect x="747" y="506" width="190" height="24" rx="4" fill="#FFF5E0" stroke="#BA7517" stroke-width="1"/>
  <text x="842" y="522" text-anchor="middle" font-size="10" fill="#412402">XGBoost.predict() → xgb_raw</text>

  <rect x="747" y="534" width="190" height="24" rx="4" fill="#FFF5E0" stroke="#BA7517" stroke-width="1"/>
  <text x="842" y="550" text-anchor="middle" font-size="10" fill="#412402">Autoencoder.recon_error()</text>

  <rect x="747" y="562" width="190" height="24" rx="4" fill="#FFF5E0" stroke="#BA7517" stroke-width="1"/>
  <text x="842" y="578" text-anchor="middle" font-size="10" fill="#412402">ensemble_blend() → 300-850</text>

  <rect x="747" y="590" width="190" height="24" rx="4" fill="#FFF5E0" stroke="#BA7517" stroke-width="1"/>
  <text x="842" y="606" text-anchor="middle" font-size="10" fill="#412402">shap.TreeExplainer() → top3</text>

  <!-- ML → FastAPI: score + shap -->
  <line x1="747" y1="624" x2="423" y2="624" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="585" y="619" text-anchor="middle" font-size="10" fill="#888">{pulse_score, shap_values}</text>

  <!-- FastAPI → Gemini: 3 calls -->
  <line x1="423" y1="645" x2="905" y2="645" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="665" y="640" text-anchor="middle" font-size="11" fill="#26215C">generate_explanation(score, shap)</text>

  <rect x="905" y="655" width="60" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="935" y="669" text-anchor="middle" font-size="10" fill="#4A1B0C">LLM call 1</text>

  <line x1="423" y1="685" x2="905" y2="685" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="665" y="680" text-anchor="middle" font-size="11" fill="#26215C">generate_actions(score, dims)</text>

  <rect x="905" y="695" width="60" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="935" y="709" text-anchor="middle" font-size="10" fill="#4A1B0C">LLM call 2</text>

  <line x1="423" y1="725" x2="905" y2="725" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="665" y="720" text-anchor="middle" font-size="11" fill="#26215C">generate_lender_memo(score)</text>

  <rect x="905" y="735" width="60" height="20" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="935" y="749" text-anchor="middle" font-size="10" fill="#4A1B0C">LLM call 3</text>

  <!-- Gemini → FastAPI: return all 3 -->
  <line x1="905" y1="760" x2="423" y2="760" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="665" y="755" text-anchor="middle" font-size="10" fill="#888">{explanation, actions[3], lender_memo}</text>

  <!-- FastAPI saves to Supabase -->
  <rect x="407" y="774" width="170" height="24" rx="4" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="492" y="790" text-anchor="middle" font-size="10" fill="#3B6D11">supabase.scores.insert(score)</text>

  <!-- FastAPI → Next.js: full score response -->
  <line x1="407" y1="808" x2="245" y2="808" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="325" y="803" text-anchor="middle" font-size="10" fill="#888">ScoreResult (full JSON)</text>

  <!-- Next.js renders dashboard -->
  <rect x="245" y="822" width="170" height="24" rx="4" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="330" y="838" text-anchor="middle" font-size="10" fill="#042C53">Render: ScoreRing + RadarChart</text>

  <!-- Next.js → User: show dashboard -->
  <line x1="245" y1="856" x2="80" y2="856" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="160" y="851" text-anchor="middle" font-size="10" fill="#888">Dashboard rendered</text>
</svg>
