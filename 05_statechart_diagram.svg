<svg width="860" height="780" viewBox="0 0 860 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <title>PulseCredit State Chart Diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#444" stroke-width="1.3"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#E24B4A" stroke-width="1.3"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#1D9E75" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="860" height="780" fill="#fafafa" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">PulseCredit — State Chart Diagram</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#666">Profile lifecycle from creation through scoring to improvement</text>

  <!-- START -->
  <circle cx="430" cy="90" r="14" fill="#1a1a1a"/>
  <line x1="430" y1="104" x2="430" y2="134" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STATE: IDLE (waiting for input) -->
  <rect x="310" y="134" width="240" height="68" rx="12" fill="white" stroke="#888780" stroke-width="2"/>
  <rect x="310" y="134" width="240" height="26" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="2"/>
  <text x="430" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">IDLE</text>
  <text x="430" y="171" text-anchor="middle" font-size="11" fill="#5F5E5A">Awaiting input selection</text>
  <text x="430" y="186" text-anchor="middle" font-size="10" fill="#888780">entry / show upload zone + persona buttons</text>

  <!-- IDLE → UPLOADING -->
  <line x1="430" y1="202" x2="430" y2="232" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="448" y="222" font-size="10" fill="#333">uploadFile()</text>

  <!-- STATE: UPLOADING -->
  <rect x="310" y="232" width="240" height="68" rx="12" fill="white" stroke="#378ADD" stroke-width="2"/>
  <rect x="310" y="232" width="240" height="26" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <text x="430" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#042C53">UPLOADING</text>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#185FA5">Parsing PDF / CSV</text>
  <text x="430" y="285" text-anchor="middle" font-size="10" fill="#378ADD">do / pdfplumber.extract → normalize</text>

  <!-- UPLOADING → PARSE_ERROR (fail) -->
  <line x1="550" y1="266" x2="640" y2="266" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="590" y="260" text-anchor="middle" font-size="10" fill="#E24B4A">parse fails</text>

  <!-- STATE: PARSE_ERROR -->
  <rect x="640" y="232" width="190" height="68" rx="12" fill="white" stroke="#E24B4A" stroke-width="2"/>
  <rect x="640" y="232" width="190" height="26" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
  <text x="735" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#A32D2D">PARSE_ERROR</text>
  <text x="735" y="270" text-anchor="middle" font-size="11" fill="#791F1F">Invalid/scanned PDF</text>
  <text x="735" y="285" text-anchor="middle" font-size="10" fill="#E24B4A">entry / show error toast</text>

  <!-- PARSE_ERROR → IDLE (retry) -->
  <line x1="640" y1="300" x2="550" y2="300" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="592" y="313" text-anchor="middle" font-size="10" fill="#E24B4A">retry()</text>

  <!-- UPLOADING → FEATURE_COMPUTE (success) -->
  <line x1="430" y1="300" x2="430" y2="330" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="448" y="320" font-size="10" fill="#1D9E75">parse OK</text>

  <!-- STATE: FEATURE_COMPUTE -->
  <rect x="290" y="330" width="280" height="82" rx="12" fill="white" stroke="#7F77DD" stroke-width="2"/>
  <rect x="290" y="330" width="280" height="26" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2"/>
  <text x="430" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215C">FEATURE_COMPUTE</text>
  <text x="430" y="368" text-anchor="middle" font-size="11" fill="#534AB7">Computing 24 features / 6 dims</text>
  <text x="430" y="383" text-anchor="middle" font-size="10" fill="#7F77DD">do / rhythm · merchant · social</text>
  <text x="430" y="397" text-anchor="middle" font-size="10" fill="#7F77DD">calendar · velocity · NLP</text>

  <!-- FEATURE_COMPUTE → ML_SCORING -->
  <line x1="430" y1="412" x2="430" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="432" font-size="10" fill="#333">features_ready</text>

  <!-- STATE: ML_SCORING (composite state) -->
  <rect x="220" y="442" width="420" height="130" rx="12" fill="white" stroke="#BA7517" stroke-width="2"/>
  <rect x="220" y="442" width="420" height="26" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="2"/>
  <text x="430" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#412402">ML_SCORING</text>
  <!-- Inner states (parallel) -->
  <rect x="236" y="474" width="174" height="48" rx="8" fill="#FFF5E0" stroke="#BA7517" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="323" y="494" text-anchor="middle" font-size="11" fill="#412402">XGBoost predict</text>
  <text x="323" y="510" text-anchor="middle" font-size="10" fill="#633806">→ xgb_raw + SHAP</text>
  <rect x="426" y="474" width="198" height="48" rx="8" fill="#FFF5E0" stroke="#D85A30" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="525" y="494" text-anchor="middle" font-size="11" fill="#4A1B0C">Autoencoder recon</text>
  <text x="525" y="510" text-anchor="middle" font-size="10" fill="#993C1D">→ ae_error signal</text>
  <!-- fork/join bars inside -->
  <rect x="228" y="470" width="404" height="4" rx="2" fill="#BA7517"/>
  <rect x="228" y="522" width="404" height="4" rx="2" fill="#BA7517"/>
  <text x="430" y="545" text-anchor="middle" font-size="10" fill="#633806">ensemble blend (60/25/15) → Platt scale → 300-850</text>
  <text x="430" y="559" text-anchor="middle" font-size="10" fill="#633806">archetype classification</text>

  <!-- ML_SCORING → LLM_EXPLANATION -->
  <line x1="430" y1="572" x2="430" y2="602" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="592" font-size="10" fill="#333">score_computed</text>

  <!-- STATE: LLM_EXPLANATION -->
  <rect x="290" y="602" width="280" height="82" rx="12" fill="white" stroke="#D85A30" stroke-width="2"/>
  <rect x="290" y="602" width="280" height="26" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="2"/>
  <text x="430" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A1B0C">LLM_EXPLANATION</text>
  <text x="430" y="640" text-anchor="middle" font-size="11" fill="#993C1D">3 Gemini Flash API calls</text>
  <text x="430" y="655" text-anchor="middle" font-size="10" fill="#D85A30">do / explanation · actions · lender_memo</text>
  <text x="430" y="670" text-anchor="middle" font-size="10" fill="#D85A30">on timeout / use cached fallback text</text>

  <!-- LLM → SCORED -->
  <line x1="430" y1="684" x2="430" y2="714" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="450" y="705" font-size="10" fill="#1D9E75">llm_done</text>

  <!-- STATE: SCORED -->
  <rect x="290" y="714" width="280" height="82" rx="12" fill="white" stroke="#1D9E75" stroke-width="2.5"/>
  <rect x="290" y="714" width="280" height="26" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2.5"/>
  <text x="430" y="732" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">SCORED</text>
  <text x="430" y="752" text-anchor="middle" font-size="11" fill="#0F6E56">Dashboard fully rendered</text>
  <text x="430" y="767" text-anchor="middle" font-size="10" fill="#1D9E75">entry / save to Supabase scores table</text>
  <text x="430" y="781" text-anchor="middle" font-size="10" fill="#1D9E75">exit / update score_history</text>

  <!-- SCORED → SIMULATING (what-if) -->
  <line x1="290" y1="755" x2="160" y2="755" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="160" y1="755" x2="160" y2="640" stroke="#534AB7" stroke-width="1.2"/>
  <text x="95" y="700" text-anchor="middle" font-size="10" fill="#534AB7">adjustSlider()</text>

  <!-- STATE: SIMULATING -->
  <rect x="20" y="602" width="160" height="68" rx="12" fill="white" stroke="#534AB7" stroke-width="2"/>
  <rect x="20" y="602" width="160" height="26" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
  <text x="100" y="620" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">SIMULATING</text>
  <text x="100" y="641" text-anchor="middle" font-size="10" fill="#534AB7">In-memory re-score</text>
  <text x="100" y="656" text-anchor="middle" font-size="10" fill="#534AB7">no Supabase write</text>

  <!-- SIMULATING → SCORED (result displayed) -->
  <line x1="160" y1="636" x2="160" y2="550" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="160" y1="550" x2="290" y2="755" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="55" y="548" font-size="10" fill="#534AB7">simulated_</text>
  <text x="55" y="561" font-size="10" fill="#534AB7">score shown</text>

  <!-- SCORED → IDLE (re-upload) -->
  <line x1="570" y1="755" x2="700" y2="755" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="700" y1="755" x2="700" y2="170" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="700" y1="170" x2="550" y2="170" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="730" y="460" font-size="10" fill="#888">uploadNew()</text>

  <!-- END -->
  <line x1="430" y1="796" x2="430" y2="826" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="430" cy="840" r="12" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="430" cy="840" r="7" fill="#1a1a1a"/>

  <!-- Legend -->
  <rect x="620" y="640" width="210" height="112" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="725" y="658" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">State Legend</text>
  <rect x="634" y="668" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="656" y="680" font-size="11" fill="#444">Happy path</text>
  <rect x="634" y="690" width="14" height="14" rx="3" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="656" y="702" font-size="11" fill="#444">Error state</text>
  <rect x="634" y="712" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="656" y="724" font-size="11" fill="#444">ML processing</text>
  <rect x="634" y="734" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="656" y="746" font-size="11" fill="#444">User interaction</text>
</svg>
